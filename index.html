<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">JobTrack</div>
        <p>Track your career journey</p>
    </header>

    <main class="container">

        <!-- Dashboard -->
        <section class="dashboard">

            <div class="stat-card">
                <span>Total Applications</span>
                <h2 id="totalApplications">0</h2>
            </div>

            <div class="stat-card">
                <span>Applied</span>
                <h2 id="appliedCount">0</h2>
            </div>

            <div class="stat-card">
                <span>Interviews</span>
                <h2 id="interviewCount">0</h2>
            </div>

            <div class="stat-card">
                <span>Selected</span>
                <h2 id="selectedCount">0</h2>
            </div>

            <div class="stat-card">
                <span>Rejected</span>
                <h2 id="rejectedCount">0</h2>
            </div>

        </section>

        <!-- Add Application -->
        <section class="form-section">

            <h2>Add Job Application</h2>

            <form id="jobForm">

                <div class="form-grid">

                    <div class="input-group">
                        <label>Company Name</label>
                        <input
                            type="text"
                            id="company"
                            placeholder="Example: Google"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label>Job Role</label>
                        <input
                            type="text"
                            id="role"
                            placeholder="Example: Frontend Developer"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label>Applied Date</label>
                        <input
                            type="date"
                            id="date"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label>Job Link</label>
                        <input
                            type="url"
                            id="jobLink"
                            placeholder="https://example.com"
                        >
                    </div>

                    <div class="input-group">
                        <label>Status</label>

                        <select id="status">
                            <option value="Applied">Applied</option>
                            <option value="Interview">Interview</option>
                            <option value="Selected">Selected</option>
                            <option value="Rejected">Rejected</option>
                        </select>

                    </div>

                </div>

                <button type="submit" class="add-btn">
                    + Add Application
                </button>

            </form>

        </section>

        <!-- Applications -->
        <section class="applications-section">

            <div class="section-header">

                <h2>My Applications</h2>

                <div class="filters">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search company or role..."
                    >

                    <select id="filterStatus">
                        <option value="All">All Status</option>
                        <option value="Applied">Applied</option>
                        <option value="Interview">Interview</option>
                        <option value="Selected">Selected</option>
                        <option value="Rejected">Rejected</option>
                    </select>

                </div>

            </div>

            <div id="applicationsList" class="applications-list">
                <!-- Applications appear here -->
            </div>

            <div id="emptyMessage" class="empty-message">
                <h3>No applications yet</h3>
                <p>Add your first job application above.</p>
            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 JobTrack | Built with HTML, CSS & JavaScript</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
