<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTrack - Job Application Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div>
        <h1>JobTrack</h1>
        <p>Track your career journey</p>
    </div>

    <button id="themeToggle" class="theme-btn">
        ☀️ Light Mode
    </button>

</header>

<main class="container">

    <!-- Dashboard -->
    <section class="dashboard">

        <div class="stat-card">
            <span>Total Applications</span>
            <strong id="totalApplications">0</strong>
        </div>

        <div class="stat-card">
            <span>Applied</span>
            <strong id="appliedCount">0</strong>
        </div>

        <div class="stat-card">
            <span>Interviews</span>
            <strong id="interviewCount">0</strong>
        </div>

        <div class="stat-card">
            <span>Selected</span>
            <strong id="selectedCount">0</strong>
        </div>

        <div class="stat-card">
            <span>Rejected</span>
            <strong id="rejectedCount">0</strong>
        </div>

    </section>


    <!-- Add / Edit Application -->
    <section class="form-section">

        <h2 id="formTitle">Add Job Application</h2>

        <form id="jobForm">

            <div class="form-grid">

                <div class="input-group">
                    <label>Company Name *</label>

                    <input
                        type="text"
                        id="company"
                        placeholder="Example: Google"
                        required
                    >
                </div>


                <div class="input-group">
                    <label>Job Role *</label>

                    <input
                        type="text"
                        id="role"
                        placeholder="Example: Frontend Developer"
                        required
                    >
                </div>


                <div class="input-group">
                    <label>Applied Date *</label>

                    <input
                        type="date"
                        id="date"
                        required
                    >
                </div>


                <div class="input-group">
                    <label>Interview Date</label>

                    <input
                        type="date"
                        id="interviewDate"
                    >
                </div>


                <div class="input-group">
                    <label>Salary</label>

                    <input
                        type="text"
                        id="salary"
                        placeholder="Example: ₹8 LPA"
                    >
                </div>


                <div class="input-group">
                    <label>Location</label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Example: Chennai / Remote"
                    >
                </div>


                <div class="input-group">
                    <label>Status</label>

                    <select id="status">

                        <option value="Applied">
                            Applied
                        </option>

                        <option value="Interview">
                            Interview
                        </option>

                        <option value="Selected">
                            Selected
                        </option>

                        <option value="Rejected">
                            Rejected
                        </option>

                    </select>

                </div>


                <div class="input-group">
                    <label>Job Link</label>

                    <input
                        type="url"
                        id="jobLink"
                        placeholder="https://example.com"
                    >
                </div>

            </div>


            <div class="input-group notes-group">

                <label>Notes</label>

                <textarea
                    id="notes"
                    placeholder="Add interview notes or other details..."
                ></textarea>

            </div>


            <div class="form-buttons">

                <button
                    type="submit"
                    class="primary-btn"
                    id="submitBtn"
                >
                    + Add Application
                </button>


                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelBtn"
                    style="display: none;"
                >
                    Cancel Edit
                </button>

            </div>

        </form>

    </section>


    <!-- Applications -->
    <section class="applications-section">

        <div class="section-header">

            <div>
                <h2>My Applications</h2>

                <p>
                    Manage all your job applications
                </p>
            </div>


            <div class="filters">

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search company or role..."
                >


                <select id="filterStatus">

                    <option value="All">
                        All Status
                    </option>

                    <option value="Applied">
                        Applied
                    </option>

                    <option value="Interview">
                        Interview
                    </option>

                    <option value="Selected">
                        Selected
                    </option>

                    <option value="Rejected">
                        Rejected
                    </option>

                </select>

            </div>

        </div>


        <div id="applicationsList"></div>


        <div
            id="emptyMessage"
            class="empty-message"
        >

            <h3>No applications found</h3>

            <p>
                Add a job application to get started.
            </p>

        </div>

    </section>

</main>


<footer>

    <p>
        © 2026 JobTrack |
        Built with HTML, CSS & JavaScript
    </p>

</footer>


<script src="script.js"></script>

</body>
</html>
